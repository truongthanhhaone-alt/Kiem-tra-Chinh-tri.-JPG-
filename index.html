<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Kiểm tra nhận thức chính trị</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-5">
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
    
    <!-- CỘT 1: FORM NHẬP THÔNG TIN VÀ THI -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4 text-green-800">1. THÔNG TIN NGƯỜI DỰ THI</h2>
      <form id="quizForm" class="space-y-3">
        <div>
          <label class="block text-sm font-medium">1. Họ và tên *</label>
          <input type="text" id="fullName" required class="w-full border p-2 rounded uppercase" placeholder="NHẬP HỌ VÀ TÊN IN HOA...">
        </div>
        <div>
          <label class="block text-sm font-medium">2. Cấp bậc *</label>
          <select id="rank" class="w-full border p-2 rounded">
            <option value="Binh nhất">Binh nhất</option>
            <option value="Hạ sĩ">Hạ sĩ</option>
            <option value="Trung sĩ">Trung sĩ</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium">3. Chức vụ *</label>
          <input type="text" id="position" class="w-full border p-2 rounded" placeholder="Chiến sĩ, Tiểu đội trưởng...">
        </div>
        <div>
          <label class="block text-sm font-medium">4. Đơn vị *</label>
          <input type="text" id="unit" class="w-full border p-2 rounded" placeholder="Đại đội 1, Đại đội 2...">
        </div>
        
        <button type="button" onclick="submitExam()" class="w-full bg-red-600 text-white font-bold py-3 rounded mt-4 hover:bg-red-700">
          NỘP BÀI THI 
        </button>
      </form>
    </div>

    <!-- CỘT 2: BẢNG XẾP HẠNG -->
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-bold mb-4 text-green-800">🏆 BẢNG XẾP HẠNG THÀNH TÍCH</h2>
      <table class="w-full text-left text-sm">
        <thead>
          <tr class="border-b bg-gray-50">
            <th class="p-2">HẠNG</th>
            <th class="p-2">HỌ TÊN / ĐƠN VỊ</th>
            <th class="p-2">CẤP BẬC</th>
            <th class="p-2">ĐIỂM</th>
          </tr>
        </thead>
        <tbody id="leaderboard">
          <tr><td colspan="4" class="p-2 text-center">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // THAY LINK GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
    const SCRIPT_URL = "https://truongthanhhaone-alt.github.io/Kiem-tra-Chinh-tri.-JPG-/";

    // Hàm lấy Bảng xếp hạng từ Google Sheet
    async function loadLeaderboard() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        const tbody = document.getElementById('leaderboard');
        tbody.innerHTML = '';
        
        data.forEach((item, index) => {
          tbody.innerHTML += `
            <tr class="border-b">
              <td class="p-2 font-bold">${index + 1}</td>
              <td class="p-2">
                <div class="font-bold">${item.fullName}</div>
                <div class="text-xs text-gray-500">${item.unit}</div>
              </td>
              <td class="p-2">${item.rank}</td>
              <td class="p-2 font-bold text-red-600">${item.score}</td>
            </tr>
          `;
        });
      } catch(e) {
        console.error("Lỗi tải bảng xếp hạng:", e);
      }
    }

    // Hàm gửi điểm số thi lên Google Sheet
    async function submitExam() {
      const payload = {
        fullName: document.getElementById('fullName').value,
        rank: document.getElementById('rank').value,
        position: document.getElementById('position').value,
        unit: document.getElementById('unit').value,
        score: Math.floor(Math.random() * 20) * 5 + 10, // Điểm giả lập ngẫu nhiên
        timeSpent: "15 phút 20 giây"
      };

      if(!payload.fullName) {
        alert("Vui lòng nhập Họ và tên!");
        return;
      }

      await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      alert("Gửi bài thi thành công!");
      loadLeaderboard(); // Làm mới bảng xếp hạng
    }

    // Tải bảng xếp hạng ngay khi vào trang
    loadLeaderboard();
  </script>
</body>
</html>
